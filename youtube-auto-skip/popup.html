<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 220px; margin: 0; padding: 14px; background: #fff; color: #111; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    label { display: flex; align-items: center; justify-content: space-between; font-size: 13px; cursor: pointer; }
    p { font-size: 12px; color: #555; margin: 12px 0 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #eee; }
      p { color: #aaa; }
    }
  </style>
</head>
<body>
  <h1>YouTube Auto Skip Ads</h1>
  <label>Saltar anuncios automáticamente <input type="checkbox" id="enabled"></label>
  <p>Anuncios saltados: <strong id="count">0</strong></p>
  <script src="popup.js"></script>
</body>
</html>
